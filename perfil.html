<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desvenda Colatina — perfil (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header id="topo"></header>
  <main id="main"></main>
  <footer><b>Protótipo acadêmico</b> criado para a Maratona de Inovação de Colatina 2026.<br>Não é um site oficial da Prefeitura de Colatina.</footer>
</div>
<script src="dados.js"></script>
<script src="app.js"></script>
<script>
DC.cabecalho(document.getElementById("topo"), "perfil");
const main = document.getElementById("main"), $ = (id) => document.getElementById(id);
const c = DC.conta(), editar = new URLSearchParams(location.search).get("editar");

const grade = (itens) => `<div class="grade">${itens.map((b) => `<div class="selo ${b.on ? "" : "off"}"><span aria-hidden="true">${b.on ? b.icone : "🔒"}</span>${b.on || b.desc ? b.nome : "???"}<small>${b.on ? b.de || "Conquistado" : b.desc || "Visite para ganhar"}</small></div>`).join("")}</div>`;

function conquistas() {
  const x = DC.xp(), nv = DC.nivel(x), sug = DC.sugestoes();
  return `<section><h2>Nível ${nv.n}: ${nv.nome}</h2>
      <p><b>${x} XP</b>${nv.prox ? ` · faltam ${nv.prox - x} XP para o próximo nível` : " · nível máximo"}</p>
      <div class="barra" role="progressbar" aria-valuenow="${nv.pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do nível"><i style="width:${nv.pct}%"></i></div>
      <p class="note">Ponto desvendado: ${DC.XP.ponto} XP · rota concluída: ${DC.XP.rota} XP · sugestão aprovada: ${DC.XP.sugestao} XP.</p></section>
    <section><h2>Badges</h2>${grade(DC.badges())}</section>
    <section><h2>Colecionáveis</h2>${grade(DC.colecionaveis())}</section>
    <section><h2>Minhas sugestões</h2>
      ${sug.length ? sug.map((s) => `<div class="item"><span class="tag ${s.status === "aprovada" ? "ok" : ""}">${s.status}</span><h3>${s.nome}</h3><p class="meta">${s.tipoNome} · ${DC.fmtData(s.data)}</p></div>`).join("") : "<p>Você ainda não sugeriu nada.</p>"}
      <a class="btn claro" href="sugerir.html">Sugerir ponto, rota ou evento</a></section>`;
}

if (!c) {
  main.innerHTML = `<section><h1>Entrar</h1><p>Entre com seu e-mail para criar seu explorador, com apelido e avatar.</p>
      <form id="fLogin"><label for="email">E-mail</label><input type="email" id="email" autocomplete="email" required>
      <button class="btn sol" type="submit">Entrar</button></form>
      <div class="msg" id="msg" role="alert"></div>
      <p class="note">Login simulado neste protótipo: o e-mail fica só neste aparelho e não há senha.</p></section>${conquistas()}`;
  $("fLogin").onsubmit = (e) => {
    e.preventDefault();
    if (DC.entrar($("email").value)) location.href = "perfil.html?editar=1"; else $("msg").textContent = "Digite um e-mail válido.";
  };
} else if (!c.apelido || editar) {
  let av = c.avatar.slice();
  const A = DC.AVATAR, grupos = [["Cor", A.cores], ["Rosto", A.rostos], ["Acessório", A.acess]];
  main.innerHTML = `<section><h1>Seu explorador</h1><div class="perfil"><div id="previa"></div><p>Escolha um apelido e monte seu avatar. Ele aparece no ranking.</p></div>
      <form id="fPerfil"><label for="apelido">Apelido</label><input type="text" class="livre" id="apelido" maxlength="20" autocomplete="nickname" required>
      ${grupos.map((g, i) => `<label id="l${i}">${g[0]}</label><div class="opcoes" role="group" aria-labelledby="l${i}">${g[1].map((o, j) =>
        `<button type="button" data-g="${i}" data-j="${j}" aria-label="${g[0]} ${j + 1}" ${i === 0 ? `style="background:${o}"` : ""}>${i === 0 ? "" : o || "–"}</button>`).join("")}</div>`).join("")}
      <button class="btn sol" type="submit">Salvar</button></form>
      <div class="msg" id="msg" role="alert"></div></section>`;
  $("apelido").value = c.apelido; // via .value, o texto do usuário nunca vira HTML
  const pintar = () => {
    $("previa").innerHTML = DC.avatarHtml(av, "g");
    document.querySelectorAll(".opcoes button").forEach((b) => b.setAttribute("aria-pressed", av[b.dataset.g] == b.dataset.j));
  };
  document.querySelectorAll(".opcoes button").forEach((b) => (b.onclick = () => { av[b.dataset.g] = +b.dataset.j; pintar(); }));
  pintar();
  $("fPerfil").onsubmit = (e) => {
    e.preventDefault();
    if (DC.definirPerfil($("apelido").value, av)) location.href = "perfil.html"; else $("msg").textContent = "O apelido deve ter de 2 a 20 caracteres.";
  };
} else {
  main.innerHTML = `<section><div class="perfil">${DC.avatarHtml(c.avatar, "g")}<div><h1>${DC.esc(c.apelido)}</h1><p class="note">${DC.esc(c.email)}</p></div></div>
      <div class="row"><a class="btn claro" href="perfil.html?editar=1">Editar avatar</a><button class="btn claro" id="btnSair" type="button">Sair</button></div></section>${conquistas()}`;
  $("btnSair").onclick = () => { DC.sair(); location.href = "perfil.html"; };
}
</script>
</body>
</html>
